name: Release Foundry system

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag and package metadata
        id: release_policy
        shell: bash
        run: |
          version="$(node -p "require('./system.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match system.json version ${version}" >&2
            exit 1
          fi
          manifest_url="$(node -p "require('./system.json').manifest")"
          if [[ "${manifest_url}" == "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/system.json" ]]; then
            # Opt-in V14 test channel: never move main or become GitHub Latest.
            git fetch --no-tags origin feature/v14-compat:refs/remotes/origin/feature/v14-compat
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/feature/v14-compat)" ]]; then
              echo "A test release must tag the current V14 feature-branch tip" >&2
              exit 1
            fi
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${manifest_url}" == "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/system.json" ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/main; then
              echo "Stable release commit ${GITHUB_SHA} is not part of origin/main" >&2
              exit 1
            fi
            if ! git diff --quiet "${GITHUB_SHA}^{commit}" refs/remotes/origin/main -- system.json; then
              echo "The tagged system.json differs from the stable update manifest on main" >&2
              exit 1
            fi
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Unrecognized update channel; refusing to publish" >&2
            exit 1
          fi
          node tests/system-manifest.test.mjs
          node tests/pack-compatibility.test.mjs
          node tests/run-combat-fixtures.mjs
          node --test tests/attack-*.test.mjs tests/saves-manual.test.mjs tests/suppressive-placement-transaction.test.mjs
          node --test tests/actor-sheet-*.test.mjs
          node --test tests/*catalog*.test.mjs tests/item-contract.test.mjs
          node tools/catalog.mjs check

      - name: Build installable archive
        shell: bash
        run: |
          version="$(node -p "require('./system.json').version")"
          package_root="dist/cyberpunk2020-rilerena"
          archive="dist/cyberpunk2020-rilerena-v${version}.zip"
          mkdir -p "${package_root}/packs"
          cp -a system.json template.json README.md CHANGELOG.md "${package_root}/"
          cp -a css docs fonts img lang module templates "${package_root}/"
          while IFS= read -r pack_path; do
            cp -a "${pack_path}" "${package_root}/packs/"
          done < <(node -e 'for (const pack of require("./system.json").packs) console.log(pack.path)')
          (
            cd "${package_root}"
            zip -X -q -r "../../${archive}" .
          )
          unzip -p "${archive}" system.json | cmp - system.json
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release_policy.outputs.prerelease }}
        shell: bash
        run: |
          version="$(node -p "require('./system.json').version")"
          archive="dist/cyberpunk2020-rilerena-v${version}.zip"
          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease --latest=false --notes "Foundry V14 test release. Install only on a backed-up, disposable world copy; live-world validation is still required. The manifest is pinned to this release and does not follow the V13 main channel.")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            "${archive}" \
            "${archive}.sha256" \
            system.json \
            "${release_flags[@]}" \
            --title "Cyberpunk 2020 (Rilerena fork) ${GITHUB_REF_NAME}" \
            --generate-notes
