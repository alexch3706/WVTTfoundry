# Packaging will be added after the remaining implementation gates pass.
# Inherited Cyberpunk tags must not publish a mismatched Witcher archive.
name: Release readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:packs
      - run: npm run validate
